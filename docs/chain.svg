<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="580" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">FTEC5660 HW1 — Receipt Chain Design</text>

  <!-- Row 1 -->
  <!-- Folder -->
  <rect x="25" y="60" width="185" height="86" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="117" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Receipt folder</text>
  <text x="117" y="112" text-anchor="middle" font-size="12" fill="#374151">receipt1…N.jpg</text>
  <text x="117" y="130" text-anchor="middle" font-size="11" fill="#6B7280">any JPEG/PNG/GIF/WebP</text>

  <line x1="210" y1="103" x2="255" y2="103" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Encode -->
  <rect x="258" y="60" width="190" height="86" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="353" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Encode image</text>
  <text x="353" y="112" text-anchor="middle" font-size="12" fill="#374151">image_data_url()</text>
  <text x="353" y="130" text-anchor="middle" font-size="11" fill="#6B7280">base64 data URL</text>

  <line x1="448" y1="103" x2="493" y2="103" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parallel votes -->
  <rect x="496" y="52" width="330" height="102" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="661" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Per-receipt extraction × 2 votes (parallel)</text>
  <text x="661" y="98" text-anchor="middle" font-size="12" fill="#374151">deepseek-v4-flash-vision-exp, temperature=0</text>
  <text x="661" y="116" text-anchor="middle" font-size="12" fill="#374151">strict JSON: {final_payment, subtotal, discounts:[…]}</text>
  <text x="661" y="138" text-anchor="middle" font-size="11" fill="#6B7280">LCEL: RunnableLambda → ChatDeepSeek → StrOutputParser · batch(max_concurrency=4)</text>

  <line x1="826" y1="103" x2="871" y2="103" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agree diamond -->
  <polygon points="960,58 1050,103 960,148 870,103" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="960" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Votes agree?</text>
  <text x="960" y="117" text-anchor="middle" font-size="11" fill="#6B7280">2-of-2 identical</text>

  <!-- Tie-break loop -->
  <path d="M 960 148 L 960 185 L 1085 185 L 1085 103 L 1053 103" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="900" y="165" width="160" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="980" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">3rd tie-breaker vote</text>
  <text x="980" y="198" text-anchor="middle" font-size="11" fill="#6B7280">2-of-3 majority wins</text>
  <text x="962" y="162" font-size="11" fill="#DC2626" font-weight="600">no</text>

  <!-- Yes down -->
  <line x1="960" y1="148" x2="960" y2="205" stroke="#374151" stroke-width="0"/>
  <text x="972" y="180" font-size="11" fill="#059669" font-weight="600">yes</text>
  <path d="M 960 148 L 960 250 L 890 250" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: plausibility -->
  <polygon points="800,205 890,250 800,295 710,250" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="800" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Plausible?</text>
  <text x="800" y="261" text-anchor="middle" font-size="11" fill="#6B7280">fields valid · paid−subtotal ≤ 1.00</text>

  <!-- Reflection loop -->
  <path d="M 710 250 L 640 250 L 640 345 L 705 345" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="708" y="325" width="185" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="800" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Corrective re-ask (reflection)</text>
  <text x="800" y="358" text-anchor="middle" font-size="11" fill="#6B7280">re-quote field rules · max 2 rounds</text>
  <text x="700" y="242" font-size="11" fill="#DC2626" font-weight="600">no</text>
  <path d="M 800 325 L 800 298" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sum -->
  <path d="M 710 250 L 620 250" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="688" y="240" font-size="11" fill="#059669" font-weight="600">yes</text>
  <rect x="395" y="200" width="222" height="100" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="506" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Exact local sum (Decimal)</text>
  <text x="506" y="250" text-anchor="middle" font-size="12" fill="#374151">Q1 = Σ final_payment</text>
  <text x="506" y="270" text-anchor="middle" font-size="12" fill="#374151">Q2 = Σ (subtotal + Σ discounts)</text>
  <text x="506" y="290" text-anchor="middle" font-size="11" fill="#6B7280">arithmetic never done by the LLM</text>

  <line x1="395" y1="250" x2="350" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Results -->
  <rect x="130" y="205" width="218" height="90" rx="10" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="239" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">results.csv</text>
  <text x="239" y="257" text-anchor="middle" font-size="12" fill="#374151">HK$1974.30 (paid)</text>
  <text x="239" y="277" text-anchor="middle" font-size="12" fill="#374151">HK$2348.20 (no discount)</text>

  <!-- Guarantee note -->
  <rect x="130" y="395" width="900" height="52" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="580" y="416" text-anchor="middle" font-size="12" fill="#374151">Guarantees: never crashes or hangs — batch failure falls back to sequential calls; unparseable receipts fall back to regex extraction,</text>
  <text x="580" y="434" text-anchor="middle" font-size="12" fill="#374151">then count as 0 with a warning. A results.csv is always produced; each response contains exactly one number.</text>
</svg>
